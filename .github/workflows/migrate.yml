# Applies the database migrations, so the schema and the deployed app can never
# drift apart again.
#
# WHY THIS EXISTS
#
# The browser talks to Supabase directly. There is no backend, and by CLAUDE.md
# there cannot be one, so deploying the app and migrating the schema were two
# separate acts by a person - and the day they came apart, every project screen
# broke. This closes that gap: the push that deploys the app is the same push
# that migrates the database.
#
# WHY IT IS SAFE
#
# Two properties, both tested rather than assumed:
#
#   supabase/ALL_MIGRATIONS.sql is idempotent, so applying it on every push is a
#   no-op whenever nothing changed. test/converge.sh proves that from three
#   different starting states.
#
#   `verify` runs first, against a throwaway Postgres. A migration that is not
#   idempotent, or that breaks the trigger, the board view or an RLS policy,
#   fails there and never reaches the real database.
#
# This is not a server and nothing here stays running. It is a script that runs
# on a push and exits, which is the same shape as the Vercel build alongside it.

name: Migrate database

on:
  push:
    branches: [claude/architectural-project-oihbvd]
    # Every push, not only the ones that touch supabase/. A push that changes
    # only the frontend cannot add a schema requirement - but it can be the
    # push where someone forgot to commit the migration, and this is exactly
    # where that should be caught. The run is idempotent and takes seconds.
  workflow_dispatch:          # so it can also be run by hand, any time

# Never two migration runs against one database at once.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Prove the migration file is safe, on a database nobody cares about.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      - name: Unit tests
        run: npm run test:js

      - name: Migrations, seed, trigger, board view and every RLS policy
        run: ./test/run.sh

      - name: The migration file converges from every starting state
        run: ./test/converge.sh

  # ---------------------------------------------------------------------------
  # Only then, the real one.
  # ---------------------------------------------------------------------------
  migrate:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Make sure psql is available
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Apply supabase/ALL_MIGRATIONS.sql
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$PGURL" ]; then
            echo "::error::The SUPABASE_DB_URL secret is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "See the 'Automatic migrations' section of README.md."
            exit 1
          fi
          # ON_ERROR_STOP so a failed statement fails the job. Each migration is
          # its own transaction, so a failure rolls that file back and the error
          # names which one.
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/ALL_MIGRATIONS.sql

      - name: Assert the database ended up current
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Applying without erroring is not the same as being current. This
          # reads the catalogue and refuses anything short of READY.
          VERDICT=$(psql "$PGURL" -tAc "$(cat supabase/READY.sql)" | tr -d '[:space:]')
          echo "verdict: $VERDICT"
          if [ "$VERDICT" != "READY" ]; then
            echo "::error::Database is not current after applying the migrations: $VERDICT"
            exit 1
          fi
          echo "### Database is READY" >> "$GITHUB_STEP_SUMMARY"
